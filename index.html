<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Fanto</title>
</head>
<body>
     <!--hero section with navbar -->
    <div class="bg-[url('/hero.png')] bg-cover bg-center h-[1200px] text-white">
        <!-- Navbar -->
          <header>
            <nav class="flex justify-between p-8">
               <!-- logo -->
                <div class="font-bold text-xl">FANTO</div
                    >
                <!-- nav links -->
                 <div class="space-x-8">
                    <a href="#">Furniture</a>
                     <a href="#">Shop</a>
                      <a href="#">About Us</a>
                       <a href="#">Contact</a>
                 </div>
                    <!-- icons -->
                    <div>
                      <i class="fa-solid fa-bag-shopping text-xl"></i>
                    </div>
            </nav>
          </header>
          <!-- heading -->
          <div class="flex justify-center mt-16 items-center">
             <h1 class="text-6xl font-bold text-center tracking-wide">
                Make Your Interior More<br>Minimalistic & Modern
             </h1>
          </div>
           <!-- paragraph -->
          <div>
             <p class="text-xl text-center mt-4 text-gray-300">
                Turn Your Room with panto into a lot more minimalist<br>and modern with ease and speed 
             </p>
          </div>
              <!-- search bar -->
               <div class="flex justify-center items-center mt-8">

                  <div class="bg-white/30 rounded-2xl px-6 py-3 w-98 flex items-center">
                      <input type="text" placeholder="Search furniture" class="bg-transparent focus:outline-none w-full text-gray-200 placeholder-gray-400" />

                      <i class="fa-solid fa-magnifying-glass bg-orange-500 text-white p-2 rounded-full"></i>
                    </div>
               </div>
    </div>
</body>
</html>
